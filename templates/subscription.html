<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kimtech Subscriptions</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    header {
      background-color: #003366;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
    }

    header img {
      width: 40px;
      height: 40px;
      margin-right: 10px;
    }

    header h1 {
      font-size: 24px;
    }

    nav {
      background: #004080;
      overflow-x: auto;
      white-space: nowrap;
      padding: 10px;
    }

    nav button {
      background: white;
      color: blue;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      margin-right: 10px;
      cursor: pointer;
    }
    
     nav button a {
       text-decoration: none;
       font-weight: bold;
       color: blue;
     }

    .plans {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }
  
     .plans h1 {
       width 100%;
       font-style: italic;
     }

    .plan {
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      margin: 10px;
      width: 180px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .plan:hover {
      transform: scale(1.05);
    }

    .plan h3 {
      margin-bottom: 10px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    }

    .modal-content label,
    .modal-content select,
    .modal-content input {
      display: block;
      width: 100%;
      margin-bottom: 15px;
    }

    .modal-content button {
      padding: 10px;
      background: #004080;
      color: white;
      border: none;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
    }

    .close {
      text-align: right;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="/static/images/logo.png" alt="Kimtech Logo">
    <h1>Kimtech Uganda</h1>
  </header>

  
  <!-- Menu -->
  <nav>
    <button> <a href="{% url 'app:home' %}">Home</a></button>
    <button> <a href="{% url 'app:report_error' %}">Report Error</a></button>    
    <button> <a href="https://wa.me/256706749801?text=Hello Kimtech, I wannt you to help me with...">Help</a></button>
    <button> <a href="https://kimtech.pythonanywhere.com">About Kimtech</a></button>
    <button> <a href="{% url 'app:logout' %}">Logout</a></button>
  </nav>

      {% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li style="color: red; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5); border-radius: 15px; padding: 15px;">{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}
  {% if msg %}
  <li style="color: red; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5); border-radius: 15px; padding: 15px;">{{ msg }}</li>
  {% endif %}

    The platform is still free for you. Subscriptions will be enabled soon.
    contact <a href="tel:0706749801">0706749801</a>/ <a href="0761357092">0761357092</a> For help. thank you!
  </p>

  <script>
    function openModal(name, amount, opt) {
      document.getElementById("selectedPlan").innerText = `Subscribe to ${name}`;
      document.getElementById("desc").innerText = ` ${opt} days at only UGX ${amount}`;
      document.getElementById("plan").value = opt;
      document.getElementById("pAmm").value = amount;
      document.getElementById("pAmm").style.display = "none";
      document.getElementById("plan").style.display = "none";
      document.getElementById("paymentModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("paymentModal").style.display = "none";
